[env:avr_iot_wg]
platform = atmelmegaavr
board = avr_iot_wg
framework = arduino
lib_deps = 
	arduino-libraries/WiFi101@^0.16.1
	dawidchyrzynski/home-assistant-integration@^2.1.0
	fastled/FastLED@^3.10.3
	marcmerlin/FastLED NeoMatrix@^1.2
