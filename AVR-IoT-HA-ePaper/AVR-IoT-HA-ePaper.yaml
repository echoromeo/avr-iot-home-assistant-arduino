alias: e-Ink Updating
description: ""
trigger:
  - platform: time_pattern
    minutes: /10
condition: []
action:
  - action: number.set_value
    metadata: {}
    data:
      value: "{{ states('sensor.temperature_upstairs') | float }}"
    target:
      entity_id: number.avr_iot_epaper_temperature_upstairs
  - action: number.set_value
    metadata: {}
    data:
      value: "{{ states('sensor.temperature_outdoor') | float }}"
    target:
      entity_id: number.avr_iot_epaper_temperature_outdoor
  - action: number.set_value
    metadata: {}
    data:
      value: "{{ states('sensor.co2_indoor') | int }}"
    target:
      entity_id: number.avr_iot_epaper_co2_indoor
  - action: number.set_value
    metadata: {}
    data:
      value: "{{ states('sensor.humidity_downstairs') | int }}"
    target:
      entity_id: number.avr_iot_epaper_humidity_downstairs
  - action: number.set_value
    metadata: {}
    data:
      value: "{{ states('sensor.humidity_upstairs') | int }}"
    target:
      entity_id: number.avr_iot_epaper_humidity_upstairs
  - action: number.set_value
    metadata: {}
    data:
      value: "{{ states('sensor.temperature_downstairs') | float }}"
    target:
      entity_id: number.avr_iot_epaper_temperature_downstairs
  - action: number.set_value
    metadata: {}
    data:
      value: "{{ states('sensor.forecast_temperature') | float }}"
    target:
      entity_id: number.avr_iot_epaper_temperature_report
  - action: mqtt.publish
    metadata: {}
    data:
      retain: true
      topic: myWeather
      payload: |
        {{ states('sensor.forecast_today') }} 
mode: single